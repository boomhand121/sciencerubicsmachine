<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>科學科評估量表製作器｜七步工作流程</title>
<style>
:root{--ink:#162334;--muted:#5c6c7c;--bg:#f4f7fb;--paper:#fff;--line:#dbe3ec;--main:#166b71;--main2:#0e5057;--pale:#e7f4f2;--warn:#9e5a12;--radius:17px;--shadow:0 12px 38px rgba(17,42,57,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.62}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}header{background:linear-gradient(125deg,#0b4852,#157477);color:#fff;padding:34px 22px 30px}header .wrap{max-width:1100px;margin:auto}header h1{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.2;margin:0 0 9px}header p{margin:0;opacity:.88}main{max-width:1100px;margin:25px auto 75px;padding:0 18px}.stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:20px}.step{background:#e7ebf1;border:1px solid transparent;padding:11px 4px;border-radius:11px;text-align:center;font-size:12px;color:#566578;font-weight:700}.step b{display:block;font-size:17px;line-height:1.2}.step.active{background:var(--main);color:white}.step.done{background:var(--pale);color:var(--main2);border-color:#aed2ce}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}.panel,.aside{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:clamp(18px,3vw,31px);min-height:370px}.aside{padding:21px}.aside h3{margin:0 0 9px;font-size:16px}.aside dl{margin:0}.aside dt{color:var(--muted);font-size:12px;margin-top:13px}.aside dd{margin:0;font-weight:650;overflow-wrap:anywhere}.aside p{font-size:13px;color:var(--muted)}.eyebrow{display:inline-block;color:var(--main2);font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:5px}.panel h2{margin:0 0 8px;font-size:clamp(1.3rem,2.5vw,1.8rem)}.intro{color:var(--muted);margin:0 0 24px}label{display:block;font-weight:700;margin:14px 0 7px}input[type=text],input[type=number],textarea,select{width:100%;padding:12px 13px;border:1px solid #b9c8d7;border-radius:10px;background:white;color:var(--ink)}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid #bce8e0;outline-offset:1px;border-color:var(--main)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:11px;background:var(--main);color:white;padding:11px 17px;font-weight:750;min-height:44px}.btn:hover{background:var(--main2)}.btn.secondary{background:white;color:var(--main2);border:1px solid #9cbdbb}.btn.danger{color:#9b352c;border:1px solid #d6b6b2;background:white}.btn.tiny{min-height:34px;padding:5px 9px;font-size:12px}.tip{background:#f0f6f8;border-left:4px solid #4c9c9a;border-radius:8px;padding:12px 15px;color:#355161;margin:14px 0}.alert{color:#9b352c;font-weight:650;min-height:1em}.grade-row{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:end;margin:9px 0}.grade-row label{margin:0 0 3px;font-size:13px}.muted{color:var(--muted)}.checklist{margin:15px 0;padding-left:25px}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0}.rubric{border-collapse:collapse;min-width:790px;width:100%;font-size:14px}.rubric th,.rubric td{border:1px solid var(--line);padding:12px;vertical-align:top;text-align:left}.rubric thead th{background:#e9f4f2;color:#174d4f}.rubric th:first-child,.rubric td:first-child{min-width:155px;width:18%;font-weight:750}.rubric td textarea{min-height:175px;font-size:13px;padding:9px;line-height:1.55}.rubric .score{width:80px;text-align:center;min-width:80px}.tag{font-size:12px;background:#f3e9cf;color:#6a4a11;border-radius:20px;padding:3px 8px;white-space:nowrap}.notice{font-size:13px;color:var(--muted)}.final-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.student-fields{padding:12px 0;border-bottom:1px solid var(--line)}.rating-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.rating-row select{width:170px}.scorebox{font-size:26px;font-weight:850;color:var(--main2);text-align:right;padding:12px 0}.hide{display:none!important}.small{font-size:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.faq{margin-top:14px;padding:17px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#4f6172;font-size:13px}footer{padding:18px;text-align:center;color:#71808d;font-size:12px}@media(max-width:880px){.layout{grid-template-columns:1fr}.aside{order:-1}.aside dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}.aside p{margin-bottom:0}}@media(max-width:530px){header{padding:24px 17px}main{padding:0 12px}.stepper{gap:3px}.step{font-size:0;padding:10px 0}.step b{font-size:14px}.grade-row{grid-template-columns:minmax(0,1fr) 74px auto;gap:5px}.grade-row .btn{padding:4px}.aside dl{grid-template-columns:1fr 1fr}.actions .btn{flex:1 1 auto}.rating-row{align-items:flex-start;flex-direction:column}.rating-row select{width:100%}}@media print{body{background:white}header,.stepper,.aside,.actions,.tip,.notice,.faq,footer,.print-hide{display:none!important}main{max-width:none;margin:0;padding:0}.layout{display:block}.panel{border:0;box-shadow:none;padding:0;min-height:0}.table-scroll{overflow:visible;border:0}.rubric{min-width:0;font-size:11px}.rubric th,.rubric td{padding:7px}.rubric thead th{background:#eaf1f1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4 landscape;margin:12mm}}
</style>
</head>
<body>
<header><div class="wrap"><h1>科學科評估量表製作器</h1><p>七步流程 · 逐格檢視 · 可複製至 Word、Google Docs、Pages</p></div></header>
<main><nav class="stepper" id="stepper" aria-label="製作步驟"></nav><div class="layout"><section class="panel" id="panel" aria-live="polite"></section><aside class="aside" id="aside"></aside></div><div class="faq"><strong>關於評語初稿：</strong>此版本在瀏覽器內使用可編輯的評語範本，不會自動連接外部 AI。它不會假設固定組件數量；教師須於第 5 步逐格核對科學內容，並輸入 OK 後才正式輸出。資料只保留在目前頁面，重新整理會清除。</div></main><footer>本網頁可離線運作 · 不會把學生或評估內容傳送至伺服器</footer>
<script>
(()=>{'use strict';
const stepLabels=['標題','分數','項目','初稿','檢視','輸出','Start'];
const initial=()=>({step:1,title:'',grades:[{name:'優異',score:3},{name:'良好',score:2},{name:'有待改善',score:1}],items:[],rubric:[],confirmed:false,ratings:[],feedback:''});
let S=initial();
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function summary(){let max=S.grades.length?Math.max(...S.grades.map(g=>Number(g.score)||0))*S.items.length:0;return `<h3>目前設定</h3><dl><dt>量表標題</dt><dd>${esc(S.title)||'尚未設定'}</dd><dt>評估等級</dt><dd>${S.grades.map(g=>esc(g.name)+'（'+esc(g.score)+'分）').join('、')}</dd><dt>評估項目</dt><dd>${S.items.length?S.items.length+' 項':'尚未設定'}</dd><dt>最高總分</dt><dd>${max} 分</dd></dl><p>所有準則可以在第 5 步逐格修改，確認 OK 前不會正式輸出。</p>`}
function nav(){el('stepper').innerHTML=stepLabels.map((t,i)=>`<div class="step ${i+1===S.step?'active':i+1<S.step?'done':''}" ${i+1===S.step?'aria-current="step"':''}><b>${i+1}</b>${esc(t)}</div>`).join('')}
function render(){nav();el('aside').innerHTML=summary();const p=el('panel');if(S.step===1)p.innerHTML=`<span class="eyebrow">STEP 01</span><h2>設定評估量表標題</h2><p class="intro">請輸入科學科活動或作品的名稱。</p><label for="title">評估量表標題</label><input id="title" type="text" value="${esc(S.title)}" placeholder="例如：DIY吸塵機設計圖製作" maxlength="150"><p class="alert" id="error"></p><div class="actions"><button class="btn" id="next1">下一步：評估等級及分數</button></div>`;
else if(S.step===2)p.innerHTML=`<span class="eyebrow">STEP 02</span><h2>設定評估等級及分數</h2><p class="intro">可以自由新增、刪除及調整等級。請確保每個等級的名稱與分數不同。</p><div id="gradeRows">${S.grades.map((g,i)=>`<div class="grade-row"><div><label for="gn${i}">等級名稱</label><input id="gn${i}" class="grade-name" data-index="${i}" type="text" value="${esc(g.name)}"></div><div><label for="gs${i}">分數</label><input id="gs${i}" class="grade-score" data-index="${i}" type="number" min="0" max="100" step="1" value="${esc(g.score)}"></div><button class="btn tiny danger" data-removegrade="${i}" aria-label="刪除此等級">刪除</button></div>`).join('')}</div><div class="actions"><button class="btn secondary" id="addGrade">＋ 新增等級</button></div><p class="alert" id="error"></p><div class="actions"><button class="btn secondary" id="back">上一步</button><button class="btn" id="next2">下一步：評估項目</button></div>`;
else if(S.step===3)p.innerHTML=`<span class="eyebrow">STEP 03</span><h2>設定評估項目</h2><p class="intro">每行輸入一個項目；不用預先限定學生設計中有多少個組件。</p><label for="items">評估項目（每行一項）</label><textarea id="items" rows="9" placeholder="能夠繪畫基本外型及細節結構\n標示各組件所用的物料名稱\n繪畫尺寸大小及合乎比例\n標示各組件的功能">${esc(S.items.join('\n'))}</textarea><div class="tip">例如：外型及結構、物料名稱、尺寸比例、各組件功能。項目將原樣保留在評估表格。</div><p class="alert" id="error"></p><div class="actions"><button class="btn secondary" id="back">上一步</button><button class="btn" id="next3">下一步：產生初稿</button></div>`;
else if(S.step===4)p.innerHTML=`<span class="eyebrow">STEP 04</span><h2>產生評估量表初稿</h2><p class="intro">依評估項目自動選擇常用評語範本，避免以固定組件數目評分；下一步可逐格修改。</p><ol class="checklist">${S.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="tip">這是規則式草稿，不是經 AI 分析的客製化準則。請按實際課題和學生設計內容核對後才確認。</div><div class="actions"><button class="btn secondary" id="back">上一步</button><button class="btn" id="generate">產生並檢視初稿</button></div>`;
else if(S.step===5)p.innerHTML=`<span class="eyebrow">STEP 05</span><h2>逐格檢視及修改</h2><p class="intro">可直接按每個格子的文字修改。所有內容均會原樣保留至正式輸出。</p><div class="tip">檢查每格是否具體、準確及可核對；如無法合理量化，不要強行加入固定數目或百分比。</div>${rubricTable(true)}<label for="feedback">修改備註（選填）</label><textarea id="feedback" rows="3" placeholder="可記下需要再檢查的地方……">${esc(S.feedback)}</textarea><p class="alert" id="error"></p><div class="actions"><button class="btn secondary" id="back">返回初稿</button><button class="btn secondary" id="saveReview">儲存本次修改</button><button class="btn" id="toConfirm">完成檢視，進行確認</button></div>`;
else if(S.step===6)renderSix();
else if(S.step===7)p.innerHTML=`<span class="eyebrow">STEP 07</span><h2>評估量表已完成</h2><p class="intro">可再複製、列印上一份量表，或開始製作另一份。</p><div class="actions"><button class="btn secondary" id="viewFinal">查看已完成量表</button><button class="btn" id="startNew">Start — 製作新量表</button></div><p class="notice">按 Start 後會重設標題、分數、項目和修訂狀態，保留七步製作流程。</p>`;
wire();}
function rubricTable(edit){return `<div class="table-scroll"><table class="rubric"><thead><tr><th>評估項目</th>${S.grades.map(g=>`<th>${esc(g.name)}（${esc(g.score)}分）</th>`).join('')}${edit?'':'<th class="score">得分</th>'}</tr></thead><tbody>${S.items.map((item,i)=>`<tr><th scope="row">${i+1}. ${esc(item)}</th>${S.grades.map((g,j)=>`<td>${edit?`<label class="sr-only" for="cell-${i}-${j}">${esc(item)}，${esc(g.name)}</label><textarea id="cell-${i}-${j}" data-ri="${i}" data-rj="${j}">${esc(S.rubric[i]?.[j]??'')}</textarea>`:esc(S.rubric[i]?.[j]??'')}</td>`).join('')}${edit?'':`<td class="score">____</td>`}</tr>`).join('')}</tbody></table></div>`}
function draft(item,rank,total){const t=item.replace(/\s/g,'');let axis;
if(/物料|材料|材質/.test(t))axis=['設計圖中需要選用物料的組件均有標示物料名稱；名稱正確，且能從用途或使用條件核對物料選擇。','各組件的物料名稱已標示，但有名稱不正確或選用物料與組件用途不符的情況；仍可辨認各組件預計採用的物料。','有組件缺少物料名稱，或已標示的物料無法辨認／與組件的基本用途衝突。','未提供可辨認的物料名稱或相關證據。'];
else if(/尺寸|比例|大小|測量/.test(t))axis=['設計圖標示製作及組裝所需尺寸，能判斷組件的大小關係，尺寸與安裝位置和連接方式一致。','有尺寸標示，但個別尺寸與繪畫比例或安裝位置不一致；仍能判斷主要組件如何配合。','缺少影響製作或組裝的關鍵尺寸，或組件大小互相衝突，需要補充資料才能判斷組裝方式。','沒有可辨認的尺寸標示或大小關係。'];
else if(/功能|運作|作用|原理/.test(t))axis=['正確說明各主要組件的作用，以及組件之間如何配合完成設計預定的運作過程；描述符合相關科學原理。','能描述主要運作過程，但個別組件的作用或配合關係有錯漏，仍可辨認設計的核心運作原理。','關鍵組件作用或運作關係描述錯誤／缺漏，無法根據說明理解預定的核心運作過程。','沒有提供可辨認的組件功能或運作說明。'];
else if(/結構|外型|外形|繪畫|設計圖|連接/.test(t))axis=['能呈現作品整體外型及運作所需的主要結構，正確顯示各部分的相對位置、連接方式與內部細節。','能呈現整體外型及主要結構，但個別連接或相對位置有錯漏；仍可辨認作品的基本構造。','缺少影響基本運作的必要結構，或組件位置及連接方式互相矛盾，無法從圖中確認基本構造。','未能提供可辨認的作品外型或結構。'];
else if(/實驗|步驟|程序|操作/.test(t))axis=['能按指定實驗目的列明必要操作、控制條件與記錄方法，步驟次序可供他人重現。','操作步驟可辨認，但有關鍵操作細節或控制條件未交代；補充後方可準確重現。','缺少影響實驗進行或結果判斷的關鍵步驟，無法依描述完成實驗。','未提供可辨認的實驗步驟。'];
else axis=[`能就「${item}」提供直接可核對的完整證據，內容符合課堂已訂明的要求，沒有影響科學正確性的錯誤。`,`能就「${item}」提供主要證據，但有不影響核心要求的錯漏；教師可指出具體有待修正之處。`,`「${item}」的必要證據缺漏或出現影響核心要求的錯誤；須依課堂要求補充或修正。`,`沒有提供與「${item}」相關而可核對的證據。`];
if(total===1)return axis[0];if(total===2)return rank===0?axis[0]:axis[2];if(total===3)return axis[rank];if(total===4)return axis[rank];return rank===0?axis[0]:rank===total-1?axis[3]:rank<total/2?axis[1]:axis[2];}
function fillDraft(){S.rubric=S.items.map(it=>S.grades.map((g,j)=>draft(it,j,S.grades.length)));S.ratings=S.items.map(()=>'');}
function persistReview(){document.querySelectorAll('[data-ri][data-rj]').forEach(x=>{S.rubric[Number(x.dataset.ri)][Number(x.dataset.rj)]=x.value.trim()});S.feedback=el('feedback')?.value??S.feedback}
function error(msg){const n=el('error');if(n)n.textContent=msg}
function renderSix(){const p=el('panel');if(!S.confirmed){p.innerHTML=`<span class="eyebrow">STEP 06</span><h2>確認正式輸出</h2><p class="intro">確認下列內容已逐格檢視，並在文字框輸入 <strong>OK</strong>。未確認前不會顯示正式版本。</p>${rubricTable(false)}<label for="ok">確認指令</label><input type="text" id="ok" placeholder="請輸入 OK" autocomplete="off"><p class="alert" id="error"></p><div class="actions"><button class="btn secondary" id="backToReview">返回逐格修改</button><button class="btn" id="confirm">OK — 正式輸出</button></div>`}
else p.innerHTML=`<span class="eyebrow">STEP 06 · 已確認</span><div class="final-head"><h2>正式評估量表</h2><span class="tag">確認完成，可複製</span></div><div id="finalArea"><h3>${esc(S.title)}</h3><div class="student-fields">學生姓名：________________　班別：________　日期：________________</div><p><strong>評估方式：</strong>${S.items.length}個項目；每項評分按所列等級；最高總分 ${Math.max(...S.grades.map(g=>Number(g.score)))*S.items.length} 分。</p>${rubricTable(false)}<p>總分：________ ／ ${Math.max(...S.grades.map(g=>Number(g.score)))*S.items.length} 分</p><p>教師評語：________________________________________________</p><p>________________________________________________________________</p></div><div class="actions print-hide"><button class="btn" id="copyRich">複製表格（Word／Docs）</button><button class="btn secondary" id="copyText">複製純文字</button><button class="btn secondary" id="downloadWord">下載 Word 可開啟文件</button><button class="btn secondary" id="print">列印／另存 PDF</button></div><h3 class="print-hide">可選：即時評分紀錄</h3><div class="print-hide">${S.items.map((x,i)=>`<div class="rating-row"><span>${i+1}. ${esc(x)}</span><select data-rating="${i}"><option value="">未評分</option>${S.grades.map(g=>`<option value="${esc(g.score)}" ${String(S.ratings[i])===String(g.score)?'selected':''}>${esc(g.name)}（${esc(g.score)}分）</option>`).join('')}</select></div>`).join('')}<div class="scorebox" id="liveTotal">— / ${Math.max(...S.grades.map(g=>Number(g.score)))*S.items.length}</div><div class="actions"><button class="btn secondary" id="copyScores">複製評分紀錄</button><button class="btn" id="finish">完成，進入 Step 7</button></div></div><p class="notice print-hide" id="copyStatus" role="status"></p>`;
}
function readGrades(){document.querySelectorAll('.grade-name').forEach(n=>S.grades[+n.dataset.index].name=n.value.trim());document.querySelectorAll('.grade-score').forEach(n=>S.grades[+n.dataset.index].score=Number(n.value));}
function wire(){let back=el('back');if(back)back.onclick=()=>{if(S.step===2)S.step=1;else if(S.step===3)S.step=2;else if(S.step===4)S.step=3;else if(S.step===5){persistReview();S.step=4;}render()};
if(el('next1'))el('next1').onclick=()=>{let t=el('title').value.trim();if(!t)return error('請先輸入量表標題。');S.title=t;S.step=2;render()};
if(el('addGrade'))el('addGrade').onclick=()=>{readGrades();S.grades.push({name:'新等級',score:0});render()};
document.querySelectorAll('[data-removegrade]').forEach(b=>b.onclick=()=>{readGrades();if(S.grades.length<=2)return error('最少需要兩個評估等級。');S.grades.splice(+b.dataset.removegrade,1);render()});
if(el('next2'))el('next2').onclick=()=>{readGrades();if(S.grades.some(g=>!g.name||!Number.isInteger(g.score)||g.score<0||g.score>100))return error('等級名稱不可留空，分數須為 0 至 100 的整數。');if(new Set(S.grades.map(g=>g.name)).size!==S.grades.length)return error('評估等級名稱不可重複。');if(new Set(S.grades.map(g=>g.score)).size!==S.grades.length)return error('不同等級不可使用相同分數。');S.grades.sort((a,b)=>b.score-a.score);S.step=3;render()};
if(el('next3'))el('next3').onclick=()=>{let items=el('items').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!items.length)return error('請至少輸入一個評估項目。');if(items.length>20)return error('目前最多支援 20 個評估項目。');S.items=items;S.step=4;render()};
if(el('generate'))el('generate').onclick=()=>{fillDraft();S.confirmed=false;S.step=5;render()};
if(el('saveReview'))el('saveReview').onclick=()=>{persistReview();error('修改已暫存於目前頁面。')};
if(el('toConfirm'))el('toConfirm').onclick=()=>{persistReview();if(S.rubric.some(row=>row.some(v=>!v.trim())))return error('每個評分格都需要有文字，請補回空白準則。');S.step=6;render()};
if(el('backToReview'))el('backToReview').onclick=()=>{S.step=5;render()};
if(el('confirm'))el('confirm').onclick=()=>{if(el('ok').value.trim().toLowerCase()!=='ok')return error('請輸入 OK 確認最終版本。');S.confirmed=true;render()};
if(el('copyRich'))el('copyRich').onclick=()=>copyRich();if(el('copyText'))el('copyText').onclick=()=>copyPlain();if(el('downloadWord'))el('downloadWord').onclick=()=>downloadWord();if(el('print'))el('print').onclick=()=>window.print();
document.querySelectorAll('[data-rating]').forEach(n=>n.onchange=()=>{S.ratings[+n.dataset.rating]=n.value;updateTotal()});
if(el('copyScores'))el('copyScores').onclick=()=>{let txt=S.items.map((it,i)=>`${i+1}. ${it}：${S.ratings[i]===''?'未評分':S.ratings[i]+'分'}`).join('\n');let v=S.ratings.every(x=>x!=='')?S.ratings.reduce((a,b)=>a+Number(b),0):'未完成';copyString(txt+'\n總分：'+v)};
if(el('finish'))el('finish').onclick=()=>{S.step=7;render()};if(el('viewFinal'))el('viewFinal').onclick=()=>{S.step=6;render()};if(el('startNew'))el('startNew').onclick=()=>{if(!confirm('確定要開始新量表？目前量表設定會被清除。'))return;S=initial();render()};}
function updateTotal(){let max=Math.max(...S.grades.map(g=>Number(g.score)))*S.items.length;el('liveTotal').textContent=(S.ratings.every(x=>x!=='')?S.ratings.reduce((a,b)=>a+Number(b),0):'—')+' / '+max}
function textVersion(){let max=Math.max(...S.grades.map(g=>Number(g.score)))*S.items.length;return `${S.title}\n學生姓名：________________　班別：________　日期：________________\n\n${S.items.map((it,i)=>`${i+1}. ${it}\n${S.grades.map((g,j)=>`${g.name}（${g.score}分）：${S.rubric[i][j]}`).join('\n')}\n得分：________`).join('\n\n')}\n\n總分：________ / ${max} 分\n教師評語：________________________________`}
function status(msg){if(el('copyStatus'))el('copyStatus').textContent=msg}
async function copyString(value){try{await navigator.clipboard.writeText(value);status('已複製文字。')}catch(e){const n=document.createElement('textarea');n.value=value;document.body.appendChild(n);n.select();let ok=document.execCommand('copy');n.remove();status(ok?'已複製文字。':'無法自動複製，請手動選取文字。')}}
function copyPlain(){copyString(textVersion())}
function htmlDoc(){return `<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:"Microsoft JhengHei",Arial,sans-serif;font-size:11pt;color:#172a33}table{border-collapse:collapse;width:100%}th,td{border:1px solid #777;padding:9px;text-align:left;vertical-align:top}th{background:#e5f2ef}h2{font-size:17pt}</style></head><body>${el('finalArea').innerHTML}</body></html>`}
async function copyRich(){const html=htmlDoc(),plain=textVersion();try{if(navigator.clipboard.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);status('已複製含表格格式的內容，可貼到 Word 或 Google Docs。');return}}catch(e){}const area=el('finalArea');const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(area);selection.removeAllRanges();selection.addRange(range);let ok=document.execCommand('copy');selection.removeAllRanges();if(ok){status('已複製可選取的表格內容。')}else{await copyString(plain);status('已改用純文字複製；貼上後可再調整表格。')}}
function downloadWord(){let blob=new Blob(['\ufeff'+htmlDoc()],{type:'application/msword;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(S.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,60)||'科學評估量表')+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);status('已下載 Word 可開啟的 .doc 文件（HTML 格式）。')}
render();
})();
</script>
</body></html>
